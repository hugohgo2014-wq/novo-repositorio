name: Build NEBULA APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nebula-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile Android APK (C++ / OpenGL ES 3.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # v4 handles command-line-tools setup and license acceptance itself.
      # Pin the SDK packages here; do not run sdkmanager --licenses a second time.
      - name: Set up Android SDK, NDK and CMake
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018 cmake;3.22.1'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-provider: basic

      - name: Verify Android toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --version
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -f app/src/main/java/com/nebula/universelab/MainActivity.java
          test -f app/src/main/cpp/native-lib.cpp
          test -d "$SDK_ROOT/platforms/android-35"
          test -d "$SDK_ROOT/ndk/27.2.12479018"
          test -d "$SDK_ROOT/cmake/3.22.1"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEBULA-Universe-Sandbox-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
