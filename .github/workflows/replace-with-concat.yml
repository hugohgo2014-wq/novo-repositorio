name: Replace NEBULA 360 with Concat Video Editor

on:
  push:
    paths:
      - ".github/workflows/replace-with-concat.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch complete Concat source and replace project
        run: |
          git clone --depth 1 https://github.com/jub0t/Concat.git /tmp/concat
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/***' /tmp/concat/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace NEBULA 360 with Concat video editor source"
          git push origin HEAD:main
