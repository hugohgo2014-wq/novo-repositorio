plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nebula360.studio'
    compileSdk 36

    defaultConfig {
        applicationId 'com.nebula360.studio'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
